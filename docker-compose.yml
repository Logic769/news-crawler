# news-crawler Docker Compose
# 常用命令：
#   docker compose build
#   docker compose run --rm crawler init
#   docker compose run --rm crawler smoke
#   docker compose run --rm crawler run --config sources.local.json --days 3
#   docker compose run --rm crawler test --config sources.local.json --name <站点名>
#   docker compose run --rm crawler shell
services:
  crawler:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        INSTALL_BROWSER: ${INSTALL_BROWSER:-1}
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-}
    image: news-crawler:local
    container_name: news-crawler
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 默认关闭：证书校验失败直接报错。仅对自签名/过期证书的站点显式开启。
      NEWS_INSECURE_SSL: ${NEWS_INSECURE_SSL:-}
    volumes:
      # 私有站点配置：只读挂载，不进镜像；首次部署脚本会自动从模板创建
      - ./sources.local.json:/app/sources.local.json:ro
      # 数据库持久化目录
      - ./data:/app/data
    # 默认行为：抓取最近 3 天（数据库由 entrypoint 落到 /app/data/news.db）
    command: ["run", "--config", "sources.local.json", "--days", "3"]
    restart: "no"

  scheduler:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        INSTALL_BROWSER: ${INSTALL_BROWSER:-1}
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-}
    image: news-crawler:local
    container_name: news-crawler-scheduler
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SCHEDULE_TIMES: ${SCHEDULE_TIMES:-09:00,15:00}
      SCHEDULE_TIMEZONE: ${SCHEDULE_TIMEZONE:-Asia/Shanghai}
      CRAWL_DAYS: ${CRAWL_DAYS:-3}
      CRAWL_CONFIG: /app/sources.local.json
      CRAWL_DB: /app/data/news.db
      CRAWL_LOCK_FILE: /app/data/.crawl.lock
      INSIGHT_URL: ${INSIGHT_URL-http://host.docker.internal:8020}
      INSIGHT_API_KEY: ${INSIGHT_API_KEY:-}
      ANALYZE_LIMIT: ${ANALYZE_LIMIT:-1000}
      NEWS_INSECURE_SSL: ${NEWS_INSECURE_SSL:-}
    volumes:
      - ./sources.local.json:/app/sources.local.json:ro
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["scheduler"]
    restart: unless-stopped
    # SIGTERM 后 scheduler 会 terminate 抓取子进程并等待最多 10 秒；
    # 30 秒宽限期足够完成回收，不会让 Docker 的默认 10 秒提前杀掉容器。
    stop_grace_period: 30s

  api:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        INSTALL_BROWSER: ${INSTALL_BROWSER:-1}
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-}
    image: news-crawler:local
    container_name: news-crawler-api
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NEWS_DB: /app/data/news.db
      NEWS_CONFIG: /app/sources.local.json
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      NEWS_JOB_WORKERS: ${NEWS_JOB_WORKERS:-1}
      NEWS_TIMEZONE: ${NEWS_TIMEZONE:-Asia/Shanghai}
      NEWS_CORS_ORIGINS: ${NEWS_CORS_ORIGINS:-}
      NEWS_ALLOW_PRIVATE_URLS: ${NEWS_ALLOW_PRIVATE_URLS:-}
      NEWS_EXTRACT_ALLOW_BROWSER: ${NEWS_EXTRACT_ALLOW_BROWSER:-}
      NEWS_MAX_PENDING_JOBS: ${NEWS_MAX_PENDING_JOBS:-50}
      NEWS_REQUIRE_AUTH: ${NEWS_REQUIRE_AUTH:-}
      NEWS_INSECURE_SSL: ${NEWS_INSECURE_SSL:-}
      NEWS_BACKUP_DIR: /app/backups
    volumes:
      # API 需要写站点配置：管理台通过 /v1/admin/sites 维护 sources.local.json。
      # crawler 服务仍是只读挂载，抓取过程不会改配置。
      - ./sources.local.json:/app/sources.local.json
      - ./data:/app/data
      - ./backups:/app/backups
    command: ["api"]
    ports:
      # 默认只绑定宿主机回环地址，避免未设置 NEWS_API_KEY 时暴露到局域网
      - "${NEWS_API_BIND:-127.0.0.1}:${NEWS_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 10s
    restart: unless-stopped
