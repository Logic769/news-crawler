name: deploy-test

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  linux-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Linux one-click deploy
        run: ./deploy.sh
