name: deploy-test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # 夜间跑一次真实网络验证：站点改版往往不会伴随代码提交，
  # 只有定时任务才能及时发现 live_news_pool.json 里的死链。
  schedule:
    - cron: "0 18 * * *"  # UTC 18:00 = 北京时间次日 02:00
  workflow_dispatch:
    inputs:
      live_news_seed:
        description: "live-news 随机种子（留空则随机）"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # 夜间定时任务用独立 group 且不取消进行中的运行：一次 push 不能把夜间验证吞掉，
  # 否则站点改版的早期信号会被白天的提交覆盖。
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  python-checks:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # docker/constraints.txt 锁定的是镜像内解释器（Python 3.12）的依赖版本；
          # 其它 Python 版本按 pyproject 的版本范围解析，否则新版本约束会排除老解释器。
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            pip install -c docker/constraints.txt ".[browser,api]"
          else
            pip install ".[browser,api]"
          fi
          # 固定版本：规则集较宽（见 pyproject 的 [tool.ruff]），上游新版本增删规则
          # 会让无关 PR 突然变红。升级时同步改这里，并本地跑一遍 ruff/mypy。
          pip install "ruff==0.17.3"
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            pip install "mypy==2.4.1"
          fi

      - name: Byte-compile all sources
        run: python -m compileall -q news_crawler.py url_extract.py smoke_fixture.py backfill_raw_content.py smoke_test.py verify_live_news.py api.py api_smoke.py news_api gne regression

      # 规则集与排除项在 pyproject.toml 的 [tool.ruff] 中，CI 与本地保持一致。
      - name: Ruff
        run: ruff check .

      - name: Mypy
        if: matrix.python-version == '3.12'
        run: python -m mypy

      - name: Smoke test
        run: python -X utf8 smoke_test.py

      # 62 个上游 HTML 样本的离线回归，基线随仓库提交（regression/baseline.json）。
      # 这替代了此前"基线只存在于维护者本机"的空缺，也让 PR 无需访问真实站点就有抽取回归保护。
      - name: Offline GNE regression
        run: python -X utf8 -m unittest discover -s regression -t . -p "test_*.py" -v

      - name: API smoke test
        run: python -X utf8 api_smoke.py

  shell-and-yaml:
    name: shell + yaml lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bash syntax check
        run: |
          bash -n docker-deploy.sh
          bash -n docker/entrypoint.sh

      - name: ShellCheck (error level, all scripts)
        run: shellcheck -S error docker-deploy.sh docker/entrypoint.sh

      - name: ShellCheck (warning+ for docker scripts)
        run: shellcheck -S warning docker-deploy.sh docker/entrypoint.sh

      - name: Validate YAML files
        run: |
          python -m pip install --quiet pyyaml
          python -c "import glob,yaml; files=glob.glob('.github/workflows/*.yml')+['docker-compose.yml']; [yaml.safe_load(open(f,encoding='utf-8')) for f in files]; print('YAML OK:', files)"

  docker-build:
    name: docker build + container smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate compose config
        run: docker compose config -q

      - name: Enforce reproducible build inputs
        run: |
          grep -Eq '^FROM python:3\.[0-9]+-slim@sha256:[0-9a-f]{64}' Dockerfile
          test -f docker/constraints.txt

      - name: Build image
        run: docker build --build-arg INSTALL_BROWSER=0 -t news-crawler:ci .

      - name: Run smoke test inside container
        run: docker run --rm news-crawler:ci smoke

      - name: Run API smoke test inside container
        run: docker run --rm --entrypoint python news-crawler:ci -X utf8 api_smoke.py

      - name: Prepare config for compose
        run: |
          cp sources.json sources.local.json
          mkdir -p data
          # compose 里的镜像名是 news-crawler:local，而上面只构建了 news-crawler:ci。
          # 先打标签，否则 compose run 会因为找不到本地镜像而触发一次隐式全量构建
          # （默认 INSTALL_BROWSER=1，会白装一遍 Chromium）。
          docker tag news-crawler:ci news-crawler:local

      - name: Compose smoke
        run: docker compose run --rm --no-deps crawler smoke

      - name: Compose API smoke
        run: |
          docker compose up -d --no-build api
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/v1/health | grep '"database":"ok"' >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "${ready:-0}" = "1"
          curl -fsS http://127.0.0.1:8000/v1/health
          docker compose logs api
          docker compose stop api

      - name: Bare API entrypoint keeps persistent DB path
        run: |
          docker run -d --name news-api-entry -v "$PWD/data:/app/data" news-crawler:ci api
          for _ in $(seq 1 30); do
            if docker exec news-api-entry python -c "import urllib.request,json; print(json.load(urllib.request.urlopen('http://127.0.0.1:8000/v1/health'))['database'])" 2>/dev/null | grep -x ok; then
              ready=1
              break
            fi
            sleep 1
          done
          test "${ready:-0}" = "1"
          docker exec news-api-entry sh -c 'tr "\0" "\n" < /proc/1/environ' | grep -xF 'NEWS_DB=/app/data/news.db'
          echo "DB PATH OK: /app/data/news.db"
          docker exec news-api-entry python -c "import urllib.request,json; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/v1/health')); assert data['database']=='ok', data; print('API HEALTH OK', data['api_version'])"
          docker logs news-api-entry
          docker stop news-api-entry

  live-news:
    name: live news (10 static / 10 JS-rendered / 10 video)
    # 真实站点抽取是硬性门槛：随机抽取的静态、JS 渲染、视频页必须全部通过，
    # 单个页面失效会由池子里的替补页面补上，但最终数量不足即失败。
    #
    # 但它依赖外部站点，PR 上失败通常是站点改版/反爬而非本次改动导致，
    # 会把无关 PR 卡住。因此 PR 只跑离线回归（python-checks 里的 unittest）。
    # 夜间定时与手动触发已由 docker-build-full 在镜像内跑同一组 10/10/10，
    # 宿主机这里只在 push 时跑，避免同一批页面夜间被抓两遍（约 45 分钟浪费）。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c docker/constraints.txt ".[browser,api]"

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Verify live news extraction
        env:
          LIVE_NEWS_SEED: ${{ github.event.inputs.live_news_seed }}
        run: python -X utf8 verify_live_news.py --static 10 --dynamic 10 --video 10

  docker-build-full:
    name: docker build (default, with browser) + smoke + live news
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 只在夜间与手动运行：push 时 live-news 已在宿主机跑过同一组 10/10/10，
    # 镜像内再跑一遍只会重复消耗 45 分钟；PR 更不需要下载 Chromium。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build default image (browser included)
        run: docker build -t news-crawler:full .

      - name: Verify Chromium launch inside container
        run: docker run --rm --entrypoint python news-crawler:full -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True, args=['--no-sandbox','--disable-dev-shm-usage']); b.close(); p.stop(); print('chromium launch OK')"

      - name: Run smoke test inside container
        run: docker run --rm news-crawler:full smoke

      - name: Run API smoke test inside container
        run: docker run --rm --entrypoint python news-crawler:full -X utf8 api_smoke.py

      - name: Run live news verification (10 static / 10 JS-rendered / 10 video)
        # 镜像内跑同一套硬性门槛，确保默认镜像（含 Chromium）真的能完成抽取
        env:
          LIVE_NEWS_SEED: ${{ github.event.inputs.live_news_seed }}
        run: docker run --rm -e LIVE_NEWS_SEED news-crawler:full live-news --static 10 --dynamic 10 --video 10

  # 夜间任务失败没有人盯着屏幕，用 issue 留痕；push/PR 失败已有 GitHub 自身通知。
  notify-nightly-failure:
    name: notify nightly failure
    runs-on: ubuntu-latest
    needs: [python-checks, shell-and-yaml, docker-build, live-news, docker-build-full]
    if: failure() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update a tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(printf '夜间定时任务失败。\n\n- 工作流: %s\n- 运行: %s/%s/actions/runs/%s\n- 分支: %s\n- 提交: %s\n\n修复后请关闭本 issue。' \
            "$GITHUB_WORKFLOW" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_REF_NAME" "$GITHUB_SHA")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'in:title 夜间回归失败' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "[nightly] 夜间回归失败" --body "$body"
          fi

