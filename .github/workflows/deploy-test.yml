name: deploy-test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      live_news_seed:
        description: "live-news 随机种子（留空则随机）"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[browser,api]"
          pip install ruff

      - name: Byte-compile all sources
        run: python -m compileall -q news_crawler.py url_extract.py smoke_test.py verify_live_news.py api.py api_smoke.py news_api gne

      - name: "Ruff (blocking rules: syntax / undefined names)"
        run: >
          ruff check --select E9,F63,F7,F82 --target-version py310
          news_crawler.py url_extract.py smoke_test.py verify_live_news.py api.py api_smoke.py news_api gne

      - name: Smoke test
        run: python -X utf8 smoke_test.py

      - name: API smoke test
        run: python -X utf8 api_smoke.py

  shell-and-yaml:
    name: shell + yaml lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          bash -n docker-deploy.sh
          bash -n docker/entrypoint.sh

      - name: ShellCheck (error level, all scripts)
        run: shellcheck -S error docker-deploy.sh docker/entrypoint.sh

      - name: ShellCheck (warning+ for docker scripts)
        run: shellcheck -S warning docker-deploy.sh docker/entrypoint.sh

      - name: Validate YAML files
        run: |
          python -m pip install --quiet pyyaml
          python -c "import glob,yaml; files=glob.glob('.github/workflows/*.yml')+['docker-compose.yml']; [yaml.safe_load(open(f,encoding='utf-8')) for f in files]; print('YAML OK:', files)"

  docker-build:
    name: docker build + container smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose config -q

      - name: Enforce reproducible build inputs
        run: |
          grep -Eq '^FROM python:3\.[0-9]+-slim@sha256:[0-9a-f]{64}' Dockerfile
          test -f docker/constraints.txt

      - name: Build image
        run: docker build --build-arg INSTALL_BROWSER=0 -t news-crawler:ci .

      - name: Run smoke test inside container
        run: docker run --rm news-crawler:ci smoke

      - name: Run API smoke test inside container
        run: docker run --rm --entrypoint python news-crawler:ci -X utf8 api_smoke.py

      - name: Prepare config for compose
        run: |
          cp sources.json sources.local.json
          mkdir -p data

      - name: Compose smoke
        run: docker compose run --rm --no-deps crawler smoke

      - name: Compose API smoke
        run: |
          docker tag news-crawler:ci news-crawler:local
          docker compose up -d --no-build api
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/v1/health | grep '"database":"ok"' >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "${ready:-0}" = "1"
          curl -fsS http://127.0.0.1:8000/v1/health
          docker compose logs api
          docker compose stop api

      - name: Bare API entrypoint keeps persistent DB path
        run: |
          docker run -d --name news-api-entry -v "$PWD/data:/app/data" news-crawler:ci api
          for _ in $(seq 1 30); do
            if docker exec news-api-entry python -c "import urllib.request,json; print(json.load(urllib.request.urlopen('http://127.0.0.1:8000/v1/health'))['database'])" 2>/dev/null | grep -x ok; then
              ready=1
              break
            fi
            sleep 1
          done
          test "${ready:-0}" = "1"
          docker exec news-api-entry sh -c 'tr "\0" "\n" < /proc/1/environ' | grep -xF 'NEWS_DB=/app/data/news.db'
          echo "DB PATH OK: /app/data/news.db"
          docker exec news-api-entry python -c "import urllib.request,json; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/v1/health')); assert data['database']=='ok', data; print('API HEALTH OK', data['api_version'])"
          docker logs news-api-entry
          docker stop news-api-entry

  docker-build-full:
    name: docker build (default, with browser) + smoke + live news
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 仅 push / 手动运行，避免每个 PR 都下载 Chromium 并访问真实新闻站点
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build default image (browser included)
        run: docker build -t news-crawler:full .

      - name: Verify Chromium launch inside container
        run: docker run --rm --entrypoint python news-crawler:full -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True, args=['--no-sandbox','--disable-dev-shm-usage']); b.close(); p.stop(); print('chromium launch OK')"

      - name: Run smoke test inside container
        run: docker run --rm news-crawler:full smoke

      - name: Run API smoke test inside container
        run: docker run --rm --entrypoint python news-crawler:full -X utf8 api_smoke.py

      - name: Run live news verification (5 static / 3 JS-rendered / 2 video)
        # 真实站点与海外 Runner 的网络状况不可控，只作观测，不阻塞 master
        continue-on-error: true
        env:
          LIVE_NEWS_SEED: ${{ github.event.inputs.live_news_seed }}
        run: docker run --rm -e LIVE_NEWS_SEED news-crawler:full live-news
