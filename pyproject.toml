# 包名沿用上游 GeneralNewsExtractor 的发行名（GPL-3.0 派生重构），但本项目
# **不向 PyPI 发布**：PyPI 上的 gne 属于上游作者，与本仓库无关。安装方式只有
# 源码（pip install -e）与 Docker 两种，详见 pypi_desc.md 与 README。
[project]
name = "gne"
version = "1.1.2"
description = "News extraction engine for the news-crawler project (source-distribution only)."
readme = "pypi_desc.md"
license = "GPL-3.0-only"
authors = [
    # 本仓库维护者；上游原作者作为 GPL 派生来源一并保留署名。
    { name = "Logic769" },
    { name = "Kingname", email = "contact@kingname.info" },
]
keywords = ["python", "webcrawler", "webspider"]
requires-python = ">=3.10"
dependencies = [
    "lxml>=4.9.1",
    "pyyaml>=5.4.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40",
]
api = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/Logic769/news-crawler"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    # 与 CI（.github/workflows/deploy-test.yml）保持一致，避免本地与 CI 结论不同。
    "mypy==2.4.1",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["backups", "data", "dist", ".tmp_smoke"]

[tool.ruff.lint]
# 在原来的 E9/F63/F7/F82 之上扩到整套 pyflakes/pycodestyle（去掉行长）+
# import 排序 + pyupgrade + bugbear，避免“静态检查偏保守”。
select = ["E", "F", "W", "I", "UP", "B"]
# 行长不阻塞 CI：项目历史行宽不统一，格式化留给编辑器。
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = [
    "news_crawler.py",
    "url_extract.py",
    "smoke_test.py",
    "smoke_fixture.py",
    "backfill_raw_content.py",
    "verify_live_news.py",
    "api.py",
    "api_smoke.py",
    "news_api",
    "gne",
]
